name: Header Check

on:
  pull_request:

permissions: {}

jobs:
  header-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # the action commits and pushes missing headers
    steps:
      - name: Check Headers
        uses: cmu-sei/Crucible-Github-Actions/actions/header@header-v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
