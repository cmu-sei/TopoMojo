name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 5"

permissions: {}

jobs:
  codeql:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/codeql.yaml@codeql-v1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: csharp
